name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  npm-package:
    name: npm wrapper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 包装冒烟测试（--version / 握手 / tools-list / --doctor）
        run: npm test

      - name: 打包含物检查
        run: npm pack --dry-run

  python-suite:
    name: python selftest (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 语法与 XML 层自检
        run: python -m compileall -q logisim_mcp && python -c "import logisim_mcp.mcp as m; print(len(m.TOOLS), 'tools')"
